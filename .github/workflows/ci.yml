name: CI

on:
  push:
    branches: ['**'] # not tags: the release workflow runs these same jobs for a version tag
  pull_request:
  workflow_call:
    inputs:
      version:
        description: The version to package with; empty for the commit's development version.
        type: string
        default: ''

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build ScreenshotTrimmer.slnx --configuration Release
      - run: dotnet test ScreenshotTrimmer.slnx --configuration Release --no-build

  package:
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ inputs.version }}
